server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # nginx's mime.types has no entry for .webmanifest
    location ~ \.webmanifest$ {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
    }

    # Always revalidate the service worker, page and data so updates reach installed apps
    location ~ ^/(sw\.js|index\.html|verbs\.json)$ {
        add_header Cache-Control "no-cache";
    }

    location /icons/ {
        add_header Cache-Control "public, max-age=604800";
    }
}
