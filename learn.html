<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Learn · Turkish Verb Flashcards</title>
<meta name="theme-color" content="#225b49">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Turkish Verbs">
<link rel="stylesheet" href="styles.css">
</head>
<body class="learn">
<div class="learnbar">
  <a class="iconbtn" href="./" aria-label="Back to home">✕</a>
  <div class="track" aria-hidden="true"><div class="bar" id="bar"></div></div>
  <span class="count" id="count">–</span>
</div>

<main class="stage">
  <div class="flashcard" id="card" role="button" tabindex="0" aria-label="Flashcard. Press to flip.">
    <div class="face front">
      <div class="face-inner">
        <span class="tag" id="tag">ESSENTIAL VERB</span>
        <div class="word" id="verb">…</div>
        <div class="prompt">What does this mean?</div>
        <div class="hint">Tap to flip · swipe for next</div>
      </div>
    </div>
    <div class="face back" aria-live="polite">
      <div class="face-inner">
        <div class="back-head">
          <div class="verb" id="backVerb"></div>
          <div class="meaning" id="meaning"></div>
        </div>
        <div class="forms" id="forms"></div>
        <div class="hint">Tap to flip back</div>
      </div>
    </div>
  </div>
  <div class="done" id="done">
    <span class="tag">DECK COMPLETE</span>
    <h2>Harika! 🎉</h2>
    <p id="doneText">You went through every card.</p>
    <div class="row">
      <button class="btn primary" id="again" type="button">Go again</button>
      <a class="btn" href="./">Back home</a>
    </div>
  </div>
</main>

<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const params=new URLSearchParams(location.search);
const cat=params.get("cat")||"all", shuffle=params.get("order")==="shuffle";
let data, deck=[], index=0, flipped=false, finished=false;

// Bold the verb form inside its example sentence (Turkish-aware case folding).
function highlight(sentence, form){
  const lo=s=>s.toLocaleLowerCase("tr");
  const i=lo(sentence).indexOf(lo(form));
  if(i<0||lo(sentence).length!==sentence.length)return esc(sentence);
  return esc(sentence.slice(0,i))+"<mark>"+esc(sentence.slice(i,i+form.length))+"</mark>"+esc(sentence.slice(i+form.length));
}
function buildDeck(){
  deck=data.verbs.filter(v=>cat==="all"||v.category===cat);
  if(shuffle)for(let i=deck.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[deck[i],deck[j]]=[deck[j],deck[i]];}
  index=0;flipped=false;finished=false;
}
function render(){
  $("done").classList.toggle("show",finished);
  $("card").style.visibility=finished?"hidden":"";
  $("bar").style.width=(finished?100:(index+1)/Math.max(deck.length,1)*100)+"%";
  if(!deck.length){$("verb").textContent="No cards";$("count").textContent="0";return;}
  if(finished){$("count").textContent=`${deck.length} / ${deck.length}`;return;}
  const v=deck[index], catLabel=(data.categories.find(c=>c.id===v.category)||{}).label||"Essential verb";
  $("count").textContent=`${index+1} / ${deck.length}`;
  $("tag").textContent=catLabel.toUpperCase();
  $("verb").textContent=v.turkish;$("backVerb").textContent=v.turkish;
  $("meaning").textContent="“"+v.english+"”";
  $("forms").innerHTML=data.forms.map(f=>{
    const form=v.forms[f.id]||"", ex=(v.examples||{})[f.id];
    return `<div class="form"><div class="form-top"><small>${esc(f.label)}</small><strong>${esc(form)}</strong></div>`+
      (ex?`<p class="ex-tr">${highlight(ex.tr,form)}</p><p class="ex-en">${esc(ex.en)}</p>`:"")+`</div>`;
  }).join("");
  $("card").classList.toggle("flipped",flipped);
  $("card").setAttribute("aria-label",flipped?`${v.turkish}: ${v.english}. Press to flip back.`:`${v.turkish}. Press to flip.`);
}
function flip(){if(finished||!deck.length)return;flipped=!flipped;if(!flipped)$("card").querySelector(".back .face-inner").scrollTop=0;render();}
function nudge(dir){const c=$("card");c.classList.remove("nudge-left","nudge-right");void c.offsetWidth;c.classList.add(dir<0?"nudge-left":"nudge-right");}
function move(n){
  if(finished||!deck.length)return;
  if(n>0&&index===deck.length-1){finished=true;render();return;}
  if(n<0&&index===0){nudge(1);return;}
  index+=n;flipped=false;$("card").querySelector(".back .face-inner").scrollTop=0;render();
}

// Tap flips; horizontal swipe moves.
const card=$("card");let sx=0,sy=0,swiped=false;
card.addEventListener("touchstart",e=>{const t=e.touches[0];sx=t.clientX;sy=t.clientY;swiped=false;},{passive:true});
card.addEventListener("touchend",e=>{const t=e.changedTouches[0],dx=t.clientX-sx,dy=t.clientY-sy;
  if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy)*1.3){swiped=true;move(dx<0?1:-1);}},{passive:true});
card.addEventListener("click",()=>{if(swiped){swiped=false;return;}flip();});
card.addEventListener("keydown",e=>{if(e.key===" "||e.key==="Enter"){e.preventDefault();flip();}});
document.addEventListener("keydown",e=>{
  if(e.key==="ArrowRight")move(1);
  else if(e.key==="ArrowLeft")move(-1);
  else if(e.key==="Escape")location.href="./";
  else if(e.key===" "&&e.target!==card){e.preventDefault();flip();}
});
$("again").addEventListener("click",()=>{buildDeck();render();});

fetch("verbs.json").then(r=>{if(!r.ok)throw new Error(r.status);return r.json();}).then(d=>{
  data=d;buildDeck();
  const c=d.categories.find(x=>x.id===cat);
  $("doneText").textContent=`You went through all ${deck.length} ${c?c.label.toLowerCase()+" ":""}cards.`;
  render();
}).catch(err=>{$("verb").textContent="Could not load verbs";console.error(err);});

if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(console.error));}
</script>
</body>
</html>
